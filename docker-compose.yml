# Agent Wolf — local topology. Bring agent-bob up FIRST (its compose
# network and dind container must already exist), then:
#   cp .env.example .env && docker compose up --build
# Then open http://localhost:${WOLF_WEB_PORT:-8081}
#
# See design/2026-08-20-agent-wolf.md § "Local topology and networking"
# (agent-bob repo) for why this shape is mandatory, not a convenience:
# agentd shares DinD's network namespace in the standalone stack, so nested
# session containers cannot resolve compose DNS and cannot reach a wolf-api
# sitting on the ordinary compose network. wolf-api therefore shares that
# same DinD container's netns instead of joining a network of its own.
services:
  wolf-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    # Shares agent-bob's dind container's network namespace: reaches
    # agentd at http://localhost:8099 (same netns) and is reachable FROM
    # session containers at http://172.17.0.1:${WOLF_API_PORT}. This service
    # therefore has no `networks:` of its own and publishes no host port —
    # only wolf-web does, below.
    network_mode: "container:${BOB_DIND_CONTAINER:-agent-bob-dind-1}"
    environment:
      WOLF_API_PORT: ${WOLF_API_PORT:-8100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${NODE_ENV:-production}
      # Unset by default (see .env.example) so wolf-api discovers the DinD
      # bridge gateway itself at boot rather than trusting a hard-coded
      # 172.17.0.1 that Docker is free to not allocate. `${WOLF_MCP_URL:-}`
      # forwards it through only when the operator has set it explicitly —
      # Compose does not inject .env values into the container on its own,
      # only variables an `environment:` entry names.
      WOLF_MCP_URL: ${WOLF_MCP_URL:-}
      # W7's market-data surface. Compose injects nothing from .env on its
      # own — only variables an `environment:` entry names — so a variable
      # documented in .env.example but missing here would simply never
      # reach the process. WOLF_MCP_TOKEN is required (wolf-api refuses to
      # boot without it); the other four are optional and carry their
      # defaults from api/src/config.ts when left empty.
      WOLF_MCP_TOKEN: ${WOLF_MCP_TOKEN:-}
      WOLF_SERIES_TOKEN_SECRET: ${WOLF_SERIES_TOKEN_SECRET:-}
      WOLF_SERIES_URL_TTL_SECONDS: ${WOLF_SERIES_URL_TTL_SECONDS:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      WOLF_MARKETDATA_CACHE_TTL_SECONDS: ${WOLF_MARKETDATA_CACHE_TTL_SECONDS:-}
      # W8's sign-in surface and Wolf's own credential to Orange. Same rule as
      # the block above: a variable documented in .env.example and read by
      # api/src/config.ts still never reaches this container without a line
      # here (R81). WOLF_API_KEY, WOLF_ALLOWED_EMAILS and WOLF_SESSION_SECRET
      # are all REQUIRED — wolf-api refuses to boot without them, naming the
      # one that is missing.
      BOB_BASE_URL: ${BOB_BASE_URL:-}
      # W11's embed URLs: the BROWSER-reachable Orange origin, which is not
      # BOB_BASE_URL (that one is agentd inside DinD's netns). Optional —
      # it carries its http://localhost:8080 default from api/src/config.ts
      # when left empty — which is exactly why it needs a line here
      # (R81/R110): without one, the origin an operator sets in .env never
      # reaches this container and every embed_url points at localhost:8080
      # regardless. api/src/config.test.ts's "R81/R110" block fails if this
      # line is missing.
      BOB_PUBLIC_URL: ${BOB_PUBLIC_URL:-}
      WOLF_API_KEY: ${WOLF_API_KEY:-}
      WOLF_ALLOWED_EMAILS: ${WOLF_ALLOWED_EMAILS:-}
      WOLF_SESSION_SECRET: ${WOLF_SESSION_SECRET:-}
      # Test-only (owner decision B6); refused alongside NODE_ENV=production.
      WOLF_TEST_LOGIN: ${WOLF_TEST_LOGIN:-}
      # W9's go-live and teardown. Both are optional and both carry their
      # defaults from api/src/config.ts when left empty — which is exactly
      # why they need a line here anyway (R81/R110): without one, the value
      # an operator sets in .env never reaches this container and the
      # process silently runs the default instead.
      WOLF_SCHEDULE_CRON: ${WOLF_SCHEDULE_CRON:-}
      WOLF_TEARDOWN_DRAIN_SECONDS: ${WOLF_TEARDOWN_DRAIN_SECONDS:-}
      # W10's evaluation poller. Optional, and it carries its default from
      # api/src/config.ts when left empty — which is exactly why it needs a
      # line here (R81/R110/R111): without one, the interval an operator sets
      # in .env never reaches this container and the process silently sweeps
      # every 300 seconds. api/src/config.test.ts's "R81/R110" block fails if
      # this line is missing.
      WOLF_POLL_INTERVAL_SECONDS: ${WOLF_POLL_INTERVAL_SECONDS:-}
      # W12's session image and critic schedule. Both are documented in
      # .env.example and read by api/src/config.ts, but W12 never added them
      # here — so until now an operator who set WOLF_CRITIC_CRON in .env got
      # the default inside the container, silently. Found by W9's implementer
      # in wave 6 and fixed on the trunk; the same R81/R110 rule as above.
      WOLF_BASE_IMAGE: ${WOLF_BASE_IMAGE:-}
      WOLF_CRITIC_CRON: ${WOLF_CRITIC_CRON:-}
      # W16's report-layer budgets. Optional, and both carry their defaults
      # from api/src/config.ts when left empty — which is exactly why they
      # need a line here (R81/R110): without one, a value an operator sets in
      # .env never reaches this container and the process silently runs the
      # default. api/src/config.test.ts's "R81/R110" block fails if either is
      # missing from this block.
      WOLF_REPORT_MAX_BYTES: ${WOLF_REPORT_MAX_BYTES:-}
      WOLF_SERIES_MAX_POINTS: ${WOLF_SERIES_MAX_POINTS:-}
    restart: unless-stopped

  wolf-web:
    build:
      context: .
      dockerfile: web/Dockerfile
      # Browser-side build variables (W13). wolf-web is a BUILT static bundle:
      # an `environment:` entry cannot reach it, because vite inlined every
      # VITE_* value at build time. A variable documented in .env.example and
      # read by web/src/env.ts still never reaches the bundle without a line
      # HERE — the same class of omission as R81, one layer further out.
      #
      # ⚠️ VITE_BOB_PUBLIC_URL must equal wolf-api's BOB_PUBLIC_URL and
      # must be listed in the `wolf` project's `allowed_origins` in Orange's
      # project map. Two variables, one origin, and nothing checks that they
      # agree — see .env.example.
      #
      # ⚠️ Changing either value requires a REBUILD (`docker compose up -d
      # --build wolf-web`); restarting the container changes nothing.
      args:
        VITE_BOB_PUBLIC_URL: ${VITE_BOB_PUBLIC_URL:-http://localhost:8080}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    # External: agent-bob's own `docker compose up` must have created
    # this network already (compose project name "agent-bob" + its
    # default network name "default" -> "agent-bob_default").
    networks:
      - agent-bob_default
    ports:
      - "${WOLF_WEB_PORT:-8081}:80"
    environment:
      # Read by nginx.conf.template's envsubst at container start — see that
      # file's comment.
      WOLF_API_PORT: ${WOLF_API_PORT:-8100}
    depends_on:
      - wolf-api
    restart: unless-stopped

networks:
  agent-bob_default:
    external: true
