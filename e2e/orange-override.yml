# X1 — the ONLY file this ticket adds to Agent Orange's compose invocation.
#
# It is passed to agent-orange's `docker compose` with a second `-f`, so the
# mock model script reaches agentd WITHOUT editing a single file in the
# agent-orange repository (X1's Files line: "No file in agent-orange is edited
# by this ticket").
#
# ⚠️ The bind-mount source is an ABSOLUTE path supplied in ${X1_MOCK_SCRIPT}.
# Relative paths inside a compose file resolve against the PROJECT directory —
# which is agent-orange's, because agent-orange's docker-compose.yml is the
# first `-f`. A literal `./e2e/mock/script.json` here would silently resolve to
# <agent-orange>/e2e/mock/script.json, a path that exists in that repo and
# holds something else entirely. run.sh exports the absolute path.
#
# agentd reads the table ONCE, at boot (go/cmd/agentd/modelproxy.go:107-108 →
# loadMockModelScript, called from main). Editing the file under a running
# agentd changes nothing: run.sh recreates the service when the table changes.
services:
  agentd:
    volumes:
      - ${X1_MOCK_SCRIPT:?X1_MOCK_SCRIPT must be an absolute path to e2e/mock/script.json}:/mock-model-script.json:ro
    environment:
      AGENTKIT_MOCK_MODEL_SCRIPT_FILE: /mock-model-script.json
